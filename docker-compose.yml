services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/app/data", "./models:/app/models", "./indexes:/app/indexes"]
    depends_on: [db]
  db:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_DB: satintel, POSTGRES_USER: satintel, POSTGRES_PASSWORD: change-me-offline}
volumes: {postgis_data: {}}
